services:
  gb2gff-fna:
    build:
      context: .
    image: gb2gff_fna:latest
    restart: unless-stopped
    init: true
    ports:
      - "${GB2GFF_FNA_PORT:-8501}:8501"
    environment:
      GB2GFF_FNA_TMPDIR: /data/tmp
    tmpfs:
      - /data/tmp:mode=1777
    entrypoint:
      - /usr/local/bin/_entrypoint.sh
      - python3
      - -m
      - streamlit
      - run
      - /opt/gb2gff_fna_web.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    healthcheck:
      test:
        - CMD
        - /opt/conda/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
