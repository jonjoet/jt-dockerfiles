<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTA / GFF Combiner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #d0d7de;
    --border-active: #a8b1ba;
    --text: #1f2328;
    --text-dim: #57606a;
    --text-muted: #8b949e;
    --accent: #0969da;
    --accent-dim: #ddf4ff;
    --green: #1a7f37;
    --green-dim: #dafbe1;
    --red: #cf222e;
    --red-dim: #ffebe9;
    --yellow: #9a6700;
    --yellow-dim: #fff8c5;
    --orange: #bc4c00;
    --purple: #8250df;
    --purple-dim: #e8dff5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .app-header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  .app-header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .app-header h1 span { color: var(--accent); }
  .app-header h1 small { color: var(--purple); font-size: 12px; font-weight: 400; }

  .app-header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
  }

  .main-content { padding: 24px; max-width: 1800px; margin: 0 auto; }

  /* Upload zone */
  .upload-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .upload-box {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 28px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface);
    position: relative;
  }

  .upload-box:hover { border-color: var(--border-active); background: var(--surface2); }
  .upload-box.loaded { border-color: var(--green); border-style: solid; }
  .upload-box.dragover { border-color: var(--accent); background: var(--accent-dim); }

  .upload-box input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  .upload-box .file-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }
  .upload-box.loaded .file-icon { opacity: 1; }

  .upload-box .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .upload-box .hint { font-size: 11px; color: var(--text-muted); }

  /* Loaded file chips */
  .file-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
    min-height: 0;
  }

  .file-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .file-chip.fasta { border-color: var(--green); }
  .file-chip.gff { border-color: var(--accent); }
  .file-chip .chip-count { color: var(--text-muted); }
  .file-chip .chip-x {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1;
  }
  .file-chip .chip-x:hover { color: var(--red); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .stat { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .stat strong { color: var(--text); font-weight: 600; font-size: 14px; }
  .stat.green strong { color: var(--green); }
  .stat.purple strong { color: var(--purple); }
  .stat.warn strong { color: var(--yellow); }
  .stats-divider { width: 1px; height: 24px; background: var(--border); }

  /* Controls bar */
  .controls-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-muted); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .toggle input { accent-color: var(--purple); cursor: pointer; }

  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.1s;
    white-space: nowrap;
  }

  button:hover { background: var(--surface2); border-color: var(--border-active); }

  button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  button.primary:hover { background: #c8e6fd; }
  button.purple { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }
  button.purple:hover { background: #ddd0f0; }
  button.danger { border-color: var(--red); color: var(--red); }
  button.success { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  button.success:hover { background: #c5f3d0; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.mini { padding: 3px 7px; font-size: 11px; }

  /* Matrix table */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }

  .table-scroll { overflow-x: auto; max-height: 62vh; overflow-y: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead { position: sticky; top: 0; z-index: 3; }

  thead th {
    background: var(--surface2);
    padding: 8px 12px;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    user-select: none;
    white-space: nowrap;
    vertical-align: bottom;
  }

  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  thead th .sort-arrow { font-size: 10px; margin-left: 4px; }

  /* Output columns */
  thead th.out-col {
    background: var(--purple-dim);
    color: var(--purple);
    text-transform: none;
    letter-spacing: 0;
    border-left: 2px solid var(--purple);
    min-width: 140px;
    vertical-align: top;
  }
  thead th.out-col:first-of-type { }
  .out-head { display: flex; flex-direction: column; gap: 4px; }
  .out-head-top { display: flex; align-items: center; gap: 4px; }
  .out-name-input {
    flex: 1;
    min-width: 0;
    padding: 3px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--purple);
    border-radius: 4px;
    background: var(--surface);
    color: var(--purple);
    outline: none;
  }
  .out-remove { cursor: pointer; color: var(--purple); font-size: 13px; line-height: 1; padding: 2px; }
  .out-remove:hover { color: var(--red); }
  .out-meta {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-muted);
    text-transform: none;
    letter-spacing: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .out-selectall { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; color: var(--purple); }
  .out-selectall input { accent-color: var(--purple); cursor: pointer; }
  .out-collision { color: var(--red); font-weight: 600; }

  td.out-cell {
    text-align: center;
    border-left: 2px solid var(--purple-dim);
  }
  td.out-cell input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer; }
  td.out-cell.collide { background: var(--red-dim); }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.08s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody tr.unused { opacity: 0.5; }

  tbody td {
    padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }

  td.numeric { text-align: right; font-variant-numeric: tabular-nums; }

  td.seq-name {
    font-weight: 500;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: text;
    position: relative;
  }
  td.seq-name:hover .edit-hint { opacity: 1; }
  .edit-hint { opacity: 0; transition: opacity 0.15s; margin-left: 4px; font-size: 10px; color: var(--text-muted); }
  td.seq-name.renamed { border-left: 3px solid var(--yellow); }
  .original-name { font-size: 10px; color: var(--text-muted); display: block; font-weight: 400; }
  .reset-rename { cursor: pointer; color: var(--text-muted); font-size: 10px; margin-left: 4px; }
  .reset-rename:hover { color: var(--red); }
  .auto-name { font-size: 10px; color: var(--purple); display: block; font-weight: 400; }
  .rename-input {
    width: 100%;
    padding: 2px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--accent);
    border-radius: 3px;
    outline: none;
    background: var(--surface);
    color: var(--text);
    box-sizing: border-box;
  }

  td.source { color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

  /* Length bar */
  .len-cell { display: flex; align-items: center; gap: 8px; }
  .len-bar-track { width: 70px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .len-bar { height: 100%; background: var(--accent); border-radius: 3px; }

  /* GC bar */
  .gc-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .gc-bar-track { width: 44px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .gc-bar { height: 100%; border-radius: 3px; }

  /* Outputs summary */
  .outputs-summary { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .out-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--purple);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .out-card h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--purple);
    margin-bottom: 6px;
    word-break: break-all;
  }
  .out-card .out-stats { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
  .out-card .out-warn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--yellow);
    background: var(--yellow-dim);
    border-radius: 4px;
    padding: 4px 6px;
    margin-bottom: 8px;
  }
  .out-card .out-warn.err { color: var(--red); background: var(--red-dim); }
  .out-card .out-dl { display: flex; gap: 6px; }

  /* Export section */
  .export-section {
    margin-top: 16px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .export-section .export-info { flex: 1; font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }

  /* Empty state */
  .empty-state { text-align: center; padding: 64px 24px; color: var(--text-muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  .warn-banner {
    background: var(--yellow-dim);
    border: 1px solid var(--yellow);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--yellow);
  }

  .warn-banner.error {
    color: var(--red);
    border-color: var(--red);
    background: var(--red-dim);
    white-space: pre-wrap;
  }

  .ambiguity-panel {
    display: none;
    background: var(--purple-dim);
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }

  .ambiguity-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .ambiguity-row select {
    padding: 4px 7px;
    border: 1px solid var(--purple);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
  }

  @media (max-width: 900px) {
    .upload-area { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1><span>&gt;</span> fasta-gff-combiner <small>build composite genomes</small></h1>
  <span class="subtitle">client-side · no data leaves your browser</span>
</header>

<div class="main-content">
  <div class="upload-area">
    <label class="upload-box" id="fastaBox">
      <input type="file" id="fastaInput" accept=".fasta,.fa,.fna,.fsa,.fas,.txt" multiple>
      <div class="file-icon">🧬</div>
      <div class="label">FASTA files</div>
      <div class="hint">.fasta, .fa, .fna — drop multiple, they accumulate</div>
    </label>
    <label class="upload-box" id="gffBox">
      <input type="file" id="gffInput" accept=".gff,.gff3,.txt" multiple>
      <div class="file-icon">📋</div>
      <div class="label">GFF files</div>
      <div class="hint">.gff, .gff3 (optional) — matched to sequences by seqid</div>
    </label>
  </div>

  <div class="file-chips" id="fileChips"></div>
  <div id="warnBanner" class="warn-banner" style="display:none;"></div>
  <div id="ambiguityPanel" class="ambiguity-panel"></div>

  <div id="workspace" style="display:none;">
    <div class="stats-bar" id="statsBar"></div>

    <div class="controls-bar">
      <input type="text" class="search-box" id="searchBox" placeholder="Search sequence names &amp; sources…">
      <label class="toggle" title="When a name appears on more than one record, append the source-file stem (and a counter if needed) to keep every export name unique.">
        <input type="checkbox" id="autoDisambig"> auto-disambiguate names
      </label>
      <button class="purple" onclick="addOutput()">+ Add output</button>
      <button class="danger" onclick="resetAll()">Reset</button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="outputs-summary" id="outputsSummary"></div>

    <div class="export-section">
      <div class="export-info" id="exportInfo"></div>
      <button class="success" onclick="downloadAllZip()" id="exportBtn">⬇ Download all (.zip)</button>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="icon">🧬</div>
    <p>Load one or more FASTA files to get started.<br>GFF files are optional and are matched to sequences by seqid.<br><br>Then define output genomes and tick which sequences go into each.</p>
  </div>
</div>

<script>
// ── State ──
let records = [];          // { id, name, exportName, desc, sequence, length, gc, sourceFile, sourceId }
let outputs = [];          // { id, name, members:Set<recordId> }
let gffSources = [];       // { id, name, features, bySeqid, directives, errors, warnings }
let gffAssignments = new Map(); // ambiguity key -> recordId
let fastaFileNames = [];   // { id, name, count, errors, warnings }
let sortCol = 'length';
let sortDir = -1;          // -1 = desc
let autoDisambiguate = false;
let recordSeq = 0;
let outputSeq = 0;
let fastaSourceSeq = 0;
let gffSourceSeq = 0;
let loadGeneration = 0;
let fastaLoadChain = Promise.resolve();
let gffLoadChain = Promise.resolve();
const MAX_ZIP_BYTES = 512 * 1024 * 1024;

// ── Parsing ──
function splitLines(text) {
  return String(text).replace(/^\uFEFF/, '').split(/\r\n|\n|\r/);
}

function maxSequenceLength(list) {
  let max = 1;
  for (const record of list) if (record.length > max) max = record.length;
  return max;
}

function parseFastaDetailed(text, sourceFile, sourceId = sourceFile) {
  const out = [];
  const errors = [];
  const warnings = [];
  let current = null;
  const lines = splitLines(text);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('>')) {
      if (current) out.push(current);
      const header = line.slice(1).trim();
      const spaceIdx = header.search(/\s/);
      const name = spaceIdx === -1 ? header : header.slice(0, spaceIdx);
      const desc = spaceIdx === -1 ? '' : header.slice(spaceIdx).trim();
      if (!name) errors.push(`line ${i + 1}: FASTA identifier is empty`);
      current = { name, desc, chunks: [], lineNo: i + 1 };
    } else if (current && line.trim()) {
      const normalized = line.replace(/\s+/g, '');
      if (normalized !== line) warnings.push(`line ${i + 1}: removed whitespace from sequence data`);
      if (/[^ACGTURYSWKMBDHVN.*?\-]/i.test(normalized)) {
        warnings.push(`line ${i + 1}: sequence contains non-IUPAC symbols`);
      }
      current.chunks.push(normalized);
    } else if (!current && line.trim()) {
      errors.push(`line ${i + 1}: sequence data appears before the first FASTA header`);
    }
  }
  if (current) out.push(current);

  const recs = out.map(s => {
    const seq = s.chunks.join('');
    if (!seq) warnings.push(`line ${s.lineNo}: FASTA record ${s.name || '(empty identifier)'} has no sequence data`);
    const upper = seq.toUpperCase();
    let gc = 0, total = 0;
    for (let i = 0; i < upper.length; i++) {
      const c = upper[i];
      if (c === 'G' || c === 'C') { gc++; total++; }
      else if (c === 'A' || c === 'T' || c === 'U') { total++; }
    }
    return {
      id: 'r' + (recordSeq++),
      name: s.name,
      exportName: null,
      desc: s.desc,
      sequence: seq,
      length: seq.length,
      gc: total > 0 ? gc / total : 0,
      sourceFile,
      sourceId
    };
  });
  return { records: recs, errors, warnings };
}

function parseFasta(text, sourceFile, sourceId = sourceFile) {
  return parseFastaDetailed(text, sourceFile, sourceId).records;
}

function parseAttributes(text) {
  const attrs = new Map();
  if (!text || text === '.') return attrs;
  for (const field of text.split(';')) {
    if (!field) continue;
    const eq = field.indexOf('=');
    if (eq <= 0) continue;
    attrs.set(field.slice(0, eq).trim(), field.slice(eq + 1).trim());
  }
  return attrs;
}

function parseGffDetailed(text) {
  const lines = splitLines(text);
  const features = [];
  const directives = [];
  const regions = [];
  const errors = [];
  const warnings = [];
  let inFasta = false;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const lineNo = i + 1;
    if (inFasta) continue;
    if (raw.trim() === '##FASTA') { inFasta = true; continue; }
    if (raw.startsWith('##sequence-region')) {
      const match = raw.match(/^##sequence-region\s+(\S+)\s+(\d+)\s+(\d+)\s*$/);
      if (!match) {
        errors.push(`line ${lineNo}: malformed ##sequence-region directive`);
      } else {
        const start = Number(match[2]), end = Number(match[3]);
        if (start < 1 || end < start) errors.push(`line ${lineNo}: invalid ##sequence-region coordinates`);
        else regions.push({ seqid: match[1], start, end, lineNo });
      }
      continue;
    }
    if (raw.startsWith('##')) {
      if (!raw.startsWith('##gff-version') && !raw.startsWith('##sequence-region') && raw !== '###') {
        directives.push(raw);
      }
      continue;
    }
    if (raw.startsWith('#') || raw.trim() === '') continue;

    const cols = raw.split('\t');
    if (cols.length !== 9) {
      errors.push(`line ${lineNo}: expected exactly 9 tab-separated GFF3 columns, found ${cols.length}`);
      continue;
    }
    if (!cols[0] || /\s/.test(cols[0])) {
      errors.push(`line ${lineNo}: GFF3 seqid is empty or contains whitespace`);
      continue;
    }
    const start = Number(cols[3]), end = Number(cols[4]);
    if (!/^\d+$/.test(cols[3]) || !/^\d+$/.test(cols[4]) || start < 1 || end < start) {
      errors.push(`line ${lineNo}: invalid GFF3 coordinates ${cols[3]}..${cols[4]}`);
      continue;
    }
    if (cols[5] !== '.' && !Number.isFinite(Number(cols[5]))) {
      errors.push(`line ${lineNo}: GFF3 score must be numeric or '.'`);
      continue;
    }
    if (!['+', '-', '.', '?'].includes(cols[6])) {
      errors.push(`line ${lineNo}: invalid GFF3 strand '${cols[6]}'`);
      continue;
    }
    if (!['0', '1', '2', '.'].includes(cols[7])) {
      errors.push(`line ${lineNo}: invalid GFF3 phase '${cols[7]}'`);
      continue;
    }
    const attributeEntries = cols[8].split(';').map(entry => entry.trim()).filter(Boolean);
    const looksGtf = attributeEntries.length > 0 &&
      attributeEntries.every(entry => /^[A-Za-z][A-Za-z0-9_]*\s+"[^"]*"$/.test(entry));
    if (looksGtf) {
      if (!cols[8].includes('=')) {
        errors.push(`line ${lineNo}: attributes appear to use GTF syntax; GTF conversion is not supported`);
        continue;
      }
      warnings.push(`line ${lineNo}: attributes may use GTF syntax; verify before export`);
    }
    features.push({ cols, raw, lineNo, start, end, attrs: parseAttributes(cols[8]) });
  }
  return { features, directives: [...new Set(directives)], regions, errors, warnings };
}

function parseGff(text) {
  return parseGffDetailed(text).features;
}

// ── File loading ──
function stem(name) { return name.replace(/\.[^.]+$/, ''); }
function sanitize(s) { return s.replace(/\s+/g, '_').replace(/[^A-Za-z0-9._\-]/g, ''); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function loadFastaFiles(fileList, generation = loadGeneration) {
  for (const file of fileList) {
    const text = await file.text();
    if (generation !== loadGeneration) return;
    const sourceId = 'f' + (++fastaSourceSeq);
    const parsed = parseFastaDetailed(text, file.name, sourceId);
    records.push(...parsed.records);
    fastaFileNames.push({ id: sourceId, name: file.name, count: parsed.records.length, errors: parsed.errors, warnings: parsed.warnings });
  }
  document.getElementById('fastaBox').classList.add('loaded');
  if (outputs.length === 0 && records.length > 0) addOutput();
  rematchGff();
  rebuild();
}

async function loadGffFiles(fileList, generation = loadGeneration) {
  for (const file of fileList) {
    const text = await file.text();
    if (generation !== loadGeneration) return;
    const parsed = parseGffDetailed(text);
    const source = {
      id: 'g' + (++gffSourceSeq),
      name: file.name,
      features: parsed.features,
      directives: parsed.directives,
      regions: parsed.regions,
      errors: parsed.errors,
      warnings: parsed.warnings,
      bySeqid: new Map()
    };
    for (const feature of source.features) {
      feature.gffSourceId = source.id;
      const seqid = feature.cols[0];
      if (!source.bySeqid.has(seqid)) source.bySeqid.set(seqid, []);
      source.bySeqid.get(seqid).push(feature);
    }
    gffSources.push(source);
  }
  document.getElementById('gffBox').classList.add('loaded');
  rematchGff();
  rebuild();
}

function assignmentKey(gffId, seqid) {
  return `${gffId}|${encodeURIComponent(seqid)}`;
}

function candidateRecords(seqid) {
  return records.filter(record => record.name === seqid);
}

function assignedRecordId(source, seqid) {
  const candidates = candidateRecords(seqid);
  if (candidates.length === 1) return candidates[0].id;
  if (candidates.length === 0) return null;
  const assigned = gffAssignments.get(assignmentKey(source.id, seqid));
  return candidates.some(record => record.id === assigned) ? assigned : null;
}

function ambiguousGffMatches() {
  const matches = [];
  for (const source of gffSources) {
    for (const [seqid, features] of source.bySeqid) {
      const candidates = candidateRecords(seqid);
      if (candidates.length > 1) {
        matches.push({
          key: assignmentKey(source.id, seqid),
          source,
          seqid,
          features,
          candidates,
          assigned: assignedRecordId(source, seqid)
        });
      }
    }
  }
  return matches;
}

function rematchGff() {
  for (const match of ambiguousGffMatches()) {
    if (match.assigned) continue;
    const sourceStem = sanitize(stem(match.source.name)).toLowerCase();
    const sameStem = match.candidates.filter(record => sanitize(stem(record.sourceFile)).toLowerCase() === sourceStem);
    if (sameStem.length === 1) gffAssignments.set(match.key, sameStem[0].id);
  }
}

function featureEntriesForRecord(rec) {
  const entries = [];
  for (const source of gffSources) {
    if (assignedRecordId(source, rec.name) !== rec.id) continue;
    for (const feature of source.bySeqid.get(rec.name) || []) entries.push({ feature, source, record: rec });
  }
  return entries;
}

function featureCount(rec) { return featureEntriesForRecord(rec).length; }

// Seqids present in GFFs that match no loaded sequence.
function orphanSeqids() {
  const names = new Set(records.map(r => r.name));
  const seqids = new Set();
  for (const source of gffSources) for (const seqid of source.bySeqid.keys()) if (!names.has(seqid)) seqids.add(seqid);
  return [...seqids];
}

// Snapshot the FileList into an array *before* any await — resetting input.value
// empties the live FileList, which would otherwise truncate the async load loop.
document.getElementById('fastaInput').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) {
    const generation = loadGeneration;
    fastaLoadChain = fastaLoadChain.then(() => loadFastaFiles(files, generation));
  }
});
document.getElementById('gffInput').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) {
    const generation = loadGeneration;
    gffLoadChain = gffLoadChain.then(() => loadGffFiles(files, generation));
  }
});

// Drag & drop highlighting (the hidden file input already accepts drops)
for (const [boxId] of [['fastaBox'],['gffBox']]) {
  const box = document.getElementById(boxId);
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('dragover'); });
  box.addEventListener('dragleave', () => box.classList.remove('dragover'));
  box.addEventListener('drop', () => box.classList.remove('dragover'));
}

// ── Outputs ──
function addOutput() {
  outputSeq++;
  outputs.push({ id: 'o' + outputSeq, name: 'genome_' + outputSeq, members: new Set() });
  rebuild();
}

function removeOutput(oid) {
  outputs = outputs.filter(o => o.id !== oid);
  rebuild();
}

function renameOutput(oid, value) {
  const o = outputs.find(o => o.id === oid);
  if (o) o.name = sanitize(value) || o.name;
}

function toggleMember(oid, rid, checked) {
  const o = outputs.find(o => o.id === oid);
  if (!o) return;
  if (checked) o.members.add(rid); else o.members.delete(rid);
  rebuild();
}

function toggleOutputAll(oid, checked) {
  const o = outputs.find(o => o.id === oid);
  if (!o) return;
  const visible = visibleRecords();
  for (const r of visible) { if (checked) o.members.add(r.id); else o.members.delete(r.id); }
  rebuild();
}

// ── Export-name resolution ──
// Returns a map recordId -> final export name, applying auto-disambiguation if enabled.
function resolveExportNames() {
  const base = Object.create(null);
  for (const r of records) base[r.id] = r.exportName || r.name;
  const map = Object.create(null);
  if (!autoDisambiguate) { for (const r of records) map[r.id] = base[r.id]; return map; }

  const counts = new Map();
  for (const r of records) counts.set(base[r.id], (counts.get(base[r.id]) || 0) + 1);
  const used = new Set();
  for (const r of records) if (counts.get(base[r.id]) === 1) used.add(base[r.id]);
  for (const r of records) {
    const nm = base[r.id];
    if (counts.get(nm) === 1) { map[r.id] = nm; continue; }
    let cand = nm + '.' + sanitize(stem(r.sourceFile));
    if (used.has(cand)) { let i = 2; while (used.has(cand + '.' + i)) i++; cand = cand + '.' + i; }
    used.add(cand);
    map[r.id] = cand;
  }
  return map;
}

// Per-output: names that collide among that output's members. Returns Map<oid, Set<recordId>>.
function collisionInfo(nameMap) {
  const result = Object.create(null);
  for (const o of outputs) {
    const byName = new Map();
    for (const rid of o.members) {
      const nm = nameMap[rid];
      if (!byName.has(nm)) byName.set(nm, []);
      byName.get(nm).push(rid);
    }
    const bad = new Set();
    for (const ids of byName.values()) if (ids.length > 1) ids.forEach(rid => bad.add(rid));
    result[o.id] = bad;
  }
  return result;
}

function unresolvedForOutput(output) {
  const unresolved = [];
  for (const match of ambiguousGffMatches()) {
    if (match.assigned) continue;
    if (match.candidates.some(record => output.members.has(record.id))) unresolved.push(match);
  }
  return unresolved;
}

function outputFeatureEntries(output) {
  const entries = [];
  for (const rid of output.members) {
    const record = records.find(item => item.id === rid);
    if (record) entries.push(...featureEntriesForRecord(record));
  }
  return entries;
}

function featureIdConflicts(output) {
  const groups = new Map();
  for (const entry of outputFeatureEntries(output)) {
    const id = entry.feature.attrs.get('ID');
    if (!id) continue;
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push(entry);
  }
  const conflicts = new Map();
  for (const [id, entries] of groups) {
    const signatures = new Set(entries.map(entry => [
      entry.record.id,
      entry.source.id,
      entry.feature.cols[1],
      entry.feature.cols[2],
      entry.feature.cols[6]
    ].join('\t')));
    if (signatures.size > 1) conflicts.set(id, entries);
  }
  return conflicts;
}

function inputErrors() {
  const errors = [];
  for (const source of fastaFileNames) for (const error of source.errors) errors.push(`${source.name}: ${error}`);
  for (const source of gffSources) for (const error of source.errors) errors.push(`${source.name}: ${error}`);
  return errors;
}

function outputBlockers(output, nameMap = resolveExportNames()) {
  const blockers = [...inputErrors()];
  const collisions = collisionInfo(nameMap)[output.id] || new Set();
  if (collisions.size) blockers.push(`${collisions.size} sequence(s) have duplicate final identifiers`);
  const unresolved = unresolvedForOutput(output);
  if (unresolved.length) blockers.push(`${unresolved.length} ambiguous GFF-to-FASTA assignment(s) are unresolved`);
  const idConflicts = featureIdConflicts(output);
  if (idConflicts.size) blockers.push(`conflicting GFF3 feature ID(s): ${[...idConflicts.keys()].join(', ')}`);
  return blockers;
}

function outputWarnings(output) {
  const warnings = [];
  const memberRecords = [...output.members].map(rid => records.find(record => record.id === rid)).filter(Boolean);
  const fastaSourceIds = new Set(memberRecords.map(record => record.sourceId));
  for (const source of fastaFileNames) {
    if (fastaSourceIds.has(source.id)) warnings.push(...source.warnings.map(w => `${source.name}: ${w}`));
  }
  const contributingGffIds = new Set(memberRecords.flatMap(record => featureEntriesForRecord(record).map(entry => entry.source.id)));
  for (const source of gffSources) {
    if (contributingGffIds.has(source.id)) warnings.push(...source.warnings.map(w => `${source.name}: ${w}`));
    if (!contributingGffIds.has(source.id)) continue;
    for (const region of source.regions) {
      const rid = assignedRecordId(source, region.seqid);
      if (!rid || !output.members.has(rid)) continue;
      const record = records.find(item => item.id === rid);
      if (record && (region.start !== 1 || region.end !== record.length)) {
        warnings.push(`${source.name} line ${region.lineNo}: declared sequence-region ${region.seqid} ${region.start}..${region.end} will be regenerated as 1..${record.length}`);
      }
    }
  }
  const members = new Map([...output.members].map(rid => [rid, records.find(record => record.id === rid)]));
  for (const record of members.values()) {
    if (!record) continue;
    for (const { feature, source } of featureEntriesForRecord(record)) {
      if (feature.end > record.length) {
        warnings.push(`${source.name} line ${feature.lineNo}: end ${feature.end} exceeds ${record.name} length ${record.length}`);
      }
    }
  }
  const orphans = orphanSeqids();
  if (orphans.length) warnings.push(`GFF seqid(s) with no loaded FASTA record will be omitted: ${orphans.join(', ')}`);
  return [...new Set(warnings)];
}

// ── Rendering ──
function rebuild() {
  renderChips();
  renderDiagnostics();
  renderAmbiguities();
  if (records.length === 0) {
    document.getElementById('workspace').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('workspace').style.display = '';
  renderStats();
  renderTable();
  renderOutputs();
}

function renderChips() {
  const chips = [];
  for (const f of fastaFileNames) {
    chips.push(`<span class="file-chip fasta">🧬 ${escapeHtml(f.name)} <span class="chip-count">${f.count} seq</span></span>`);
  }
  for (const f of gffSources) {
    chips.push(`<span class="file-chip gff">📋 ${escapeHtml(f.name)} <span class="chip-count">${f.features.length} feat</span></span>`);
  }
  document.getElementById('fileChips').innerHTML = chips.join('');
}

function renderDiagnostics() {
  const banner = document.getElementById('warnBanner');
  const errors = inputErrors();
  const warnings = [];
  for (const source of fastaFileNames) warnings.push(...source.warnings.map(w => `${source.name}: ${w}`));
  for (const source of gffSources) warnings.push(...source.warnings.map(w => `${source.name}: ${w}`));
  const orphans = orphanSeqids();
  if (orphans.length) warnings.push(`GFF seqid(s) with no loaded FASTA record will be omitted: ${orphans.join(', ')}`);
  const messages = [];
  if (errors.length) messages.push(`Cannot export:\n• ${errors.join('\n• ')}`);
  if (warnings.length) messages.push(`Warnings:\n• ${[...new Set(warnings)].join('\n• ')}`);
  banner.textContent = messages.join('\n\n');
  banner.style.display = messages.length ? 'block' : 'none';
  banner.classList.toggle('error', errors.length > 0);
}

function assignGffMatch(key, rid) {
  if (rid) gffAssignments.set(key, rid); else gffAssignments.delete(key);
  rebuild();
}

function renderAmbiguities() {
  const panel = document.getElementById('ambiguityPanel');
  const matches = ambiguousGffMatches();
  if (!matches.length) {
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }
  const rows = matches.map(match => {
    const options = [`<option value="">Choose target record…</option>`];
    for (const record of match.candidates) {
      options.push(`<option value="${record.id}" ${match.assigned === record.id ? 'selected' : ''}>${escapeHtml(record.sourceFile)} — ${escapeHtml(record.name)} (${record.length.toLocaleString()} bp)</option>`);
    }
    return `<div class="ambiguity-row">
      <span>${escapeHtml(match.source.name)}: <strong>${escapeHtml(match.seqid)}</strong> (${match.features.length} feature${match.features.length === 1 ? '' : 's'}) →</span>
      <select data-key="${escapeHtml(match.key)}" onchange="assignGffMatch(this.dataset.key, this.value)">${options.join('')}</select>
    </div>`;
  });
  panel.innerHTML = `<strong>Resolve duplicate-seqid annotation targets</strong>${rows.join('')}`;
  panel.style.display = 'block';
}

function fmtBp(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' Gb';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' Mb';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + ' kb';
  return n.toLocaleString() + ' bp';
}

function renderStats() {
  const totalBp = records.reduce((a, r) => a + r.length, 0);
  const totalFeats = records.reduce((a, r) => a + featureCount(r), 0);
  let html = `
    <div class="stat"><strong>${records.length}</strong> sequences</div>
    <div class="stat"><strong>${fmtBp(totalBp)}</strong> total</div>
    <div class="stat green"><strong>${totalFeats.toLocaleString()}</strong> features matched</div>
    <div class="stats-divider"></div>
    <div class="stat purple"><strong>${outputs.length}</strong> output${outputs.length===1?'':'s'}</div>
  `;
  document.getElementById('statsBar').innerHTML = html;
}

function visibleRecords() {
  const filter = document.getElementById('searchBox').value.toLowerCase();
  let list = records.filter(r => {
    if (!filter) return true;
    return r.name.toLowerCase().includes(filter)
        || (r.exportName && r.exportName.toLowerCase().includes(filter))
        || r.sourceFile.toLowerCase().includes(filter);
  });
  list.sort((a, b) => {
    let va, vb;
    if (sortCol === '_feat') { va = featureCount(a); vb = featureCount(b); }
    else if (sortCol === 'name') { va = (a.exportName||a.name); vb = (b.exportName||b.name); }
    else if (sortCol === 'sourceFile') { va = a.sourceFile; vb = b.sourceFile; }
    else { va = a[sortCol]; vb = b[sortCol]; }
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });
  return list;
}

function renderTable() {
  const nameMap = resolveExportNames();
  const collisions = collisionInfo(nameMap);
  const visible = visibleRecords();
  const maxLen = maxSequenceLength(records);

  const baseCols = [
    { key: 'name', label: 'Sequence', sortable: true },
    { key: 'sourceFile', label: 'Source', sortable: true },
    { key: 'length', label: 'Length', sortable: true },
    { key: 'gc', label: 'GC %', sortable: true },
    { key: '_feat', label: 'Feats', sortable: true },
  ];

  let headHTML = baseCols.map(c => {
    const sorted = sortCol === c.key;
    const arrow = sorted ? (sortDir === 1 ? '▲' : '▼') : '';
    return `<th class="sortable ${sorted?'sorted':''}" onclick="doSort('${c.key}')">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  }).join('');

  for (const o of outputs) {
    const memCount = o.members.size;
    const memBp = [...o.members].reduce((a, rid) => { const r = records.find(x=>x.id===rid); return a + (r?r.length:0); }, 0);
    const allVisChecked = visible.length > 0 && visible.every(r => o.members.has(r.id));
    const collCount = collisions[o.id].size;
    headHTML += `<th class="out-col">
      <div class="out-head">
        <div class="out-head-top">
          <input class="out-name-input" type="text" value="${escapeHtml(o.name)}"
                 onchange="renameOutput('${o.id}', this.value)" title="Output file name (without extension)">
          <span class="out-remove" onclick="removeOutput('${o.id}')" title="Remove this output">✕</span>
        </div>
        <div class="out-meta">
          <label class="out-selectall" title="Select all visible sequences for this output">
            <input type="checkbox" ${allVisChecked?'checked':''} onchange="toggleOutputAll('${o.id}', this.checked)"> all
          </label>
          <span>${memCount} · ${fmtBp(memBp)}</span>
          ${collCount ? `<span class="out-collision" title="Duplicate names in this output">⚠${collCount}</span>` : ''}
        </div>
      </div>
    </th>`;
  }
  document.getElementById('tableHead').innerHTML = headHTML;

  const rows = visible.map(r => {
    const used = outputs.some(o => o.members.has(r.id));
    const pctLen = (r.length / maxLen * 100).toFixed(1);
    const gcPct = (r.gc * 100).toFixed(1);
    const gcColor = r.gc < 0.35 ? 'var(--accent)' : r.gc > 0.65 ? 'var(--orange)' : 'var(--green)';
    const feats = featureCount(r);
    const isRenamed = !!r.exportName;
    const finalName = nameMap[r.id];
    const autoChanged = !isRenamed && finalName !== r.name;

    let nameContent = `<span class="display-name">${escapeHtml(isRenamed ? r.exportName : r.name)}</span>`;
    if (isRenamed) {
      nameContent += `<span class="original-name">was: ${escapeHtml(r.name)}</span>`;
      nameContent += `<span class="reset-rename" onclick="event.stopPropagation(); resetRename('${r.id}')" title="Reset to original name">✕</span>`;
    } else {
      nameContent += '<span class="edit-hint">✎</span>';
    }
    if (autoChanged) nameContent += `<span class="auto-name">→ ${escapeHtml(finalName)}</span>`;

    let row = `<tr class="${used?'':'unused'}">`;
    row += `<td class="seq-name ${isRenamed?'renamed':''}" title="${escapeHtml(r.desc || r.name)}" onclick="startRename(this, '${r.id}')">${nameContent}</td>`;
    row += `<td class="source" title="${escapeHtml(r.sourceFile)}">${escapeHtml(r.sourceFile)}</td>`;
    row += `<td class="numeric"><div class="len-cell"><span>${r.length.toLocaleString()}</span><div class="len-bar-track"><div class="len-bar" style="width:${pctLen}%"></div></div></div></td>`;
    row += `<td class="numeric"><div class="gc-cell"><span>${gcPct}%</span><div class="gc-bar-track"><div class="gc-bar" style="width:${gcPct}%;background:${gcColor}"></div></div></div></td>`;
    row += `<td class="numeric">${feats ? feats.toLocaleString() : '—'}</td>`;
    for (const o of outputs) {
      const checked = o.members.has(r.id);
      const collide = checked && collisions[o.id].has(r.id);
      row += `<td class="out-cell ${collide?'collide':''}"><input type="checkbox" ${checked?'checked':''} onchange="toggleMember('${o.id}','${r.id}', this.checked)"></td>`;
    }
    row += `</tr>`;
    return row;
  });
  document.getElementById('tableBody').innerHTML = rows.join('');
}

function renderOutputs() {
  const nameMap = resolveExportNames();
  const collisions = collisionInfo(nameMap);
  const cards = outputs.map(o => {
    const mem = orderedMembers(o, nameMap);
    const bp = mem.reduce((a, r) => a + r.length, 0);
    const feats = mem.reduce((a, r) => a + featureCount(r), 0);
    const hasGff = feats > 0;
    const blockers = outputBlockers(o, nameMap);
    let warn = '';
    if (mem.length === 0) warn = `<div class="out-warn">empty — no sequences selected</div>`;
    else if (blockers.length) warn = `<div class="out-warn err">⚠ ${escapeHtml(blockers.join(' · '))}</div>`;
    return `<div class="out-card">
      <h3>${escapeHtml(o.name)}</h3>
      <div class="out-stats">${mem.length} seq · ${fmtBp(bp)}${hasGff?` · ${feats.toLocaleString()} feat`:''}</div>
      ${warn}
      <div class="out-dl">
        <button class="mini" ${(mem.length && !blockers.length)?'':'disabled'} onclick="downloadOutput('${o.id}','fasta')">⬇ FASTA</button>
        <button class="mini" ${(hasGff && !blockers.length)?'':'disabled'} onclick="downloadOutput('${o.id}','gff')">⬇ GFF</button>
      </div>
    </div>`;
  });
  document.getElementById('outputsSummary').innerHTML = cards.join('');

  // export info / button state
  const totalFiles = outputs.reduce((a, o) => {
    const mem = [...o.members];
    if (!mem.length) return a;
    const feats = mem.reduce((s, rid) => { const r = records.find(x=>x.id===rid); return s + (r?featureCount(r):0); }, 0);
    return a + 1 + (feats > 0 ? 1 : 0);
  }, 0);
  const nonEmpty = outputs.filter(o => o.members.size > 0).length;
  const blockedOutputs = outputs.filter(o => o.members.size > 0 && outputBlockers(o, nameMap).length > 0);
  document.getElementById('exportInfo').innerHTML =
    `<strong>${nonEmpty}</strong> non-empty output${nonEmpty===1?'':'s'} → <strong>${totalFiles}</strong> file${totalFiles===1?'':'s'} in the zip` +
    (blockedOutputs.length ? ` · <span style="color:var(--red)">resolve ${blockedOutputs.length} blocked output${blockedOutputs.length === 1 ? '' : 's'} first</span>` : '');
  document.getElementById('exportBtn').disabled = (nonEmpty === 0 || blockedOutputs.length > 0);
}

// Members of an output in current table sort order, returning record objects.
function orderedMembers(o, nameMap) {
  return visibleRecordsAllOrder().filter(r => o.members.has(r.id));
}

// Like visibleRecords() but ignores the search filter (export should not depend on search).
function visibleRecordsAllOrder() {
  let list = [...records];
  list.sort((a, b) => {
    let va, vb;
    if (sortCol === '_feat') { va = featureCount(a); vb = featureCount(b); }
    else if (sortCol === 'name') { va = (a.exportName||a.name); vb = (b.exportName||b.name); }
    else if (sortCol === 'sourceFile') { va = a.sourceFile; vb = b.sourceFile; }
    else { va = a[sortCol]; vb = b[sortCol]; }
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });
  return list;
}

function doSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = (col === 'name' || col === 'sourceFile') ? 1 : -1; }
  rebuild();
}

document.getElementById('searchBox').addEventListener('input', () => { renderTable(); });
document.getElementById('autoDisambig').addEventListener('change', e => { autoDisambiguate = e.target.checked; rebuild(); });

// ── Rename ──
function startRename(cell, rid) {
  if (cell.querySelector('.rename-input')) return;
  const r = records.find(x => x.id === rid);
  const current = r.exportName || r.name;
  cell.innerHTML = `<input class="rename-input" type="text" value="${escapeHtml(current)}"
    onblur="commitRename('${rid}', this)"
    onkeydown="if(event.key==='Enter'){this.blur();}if(event.key==='Escape'){this.dataset.cancel='1';this.blur();}">`;
  const input = cell.querySelector('.rename-input');
  input.focus();
  input.select();
}

function commitRename(rid, input) {
  const r = records.find(x => x.id === rid);
  if (input.dataset.cancel === '1') { renderTable(); return; }
  let trimmed = sanitize(input.value.trim());
  r.exportName = (!trimmed || trimmed === r.name) ? null : trimmed;
  rebuild();
}

function resetRename(rid) {
  const r = records.find(x => x.id === rid);
  r.exportName = null;
  rebuild();
}

function resetAll() {
  if (!confirm('Clear all loaded files and outputs?')) return;
  loadGeneration++;
  records = []; outputs = []; gffSources = []; gffAssignments = new Map(); fastaFileNames = [];
  recordSeq = 0; outputSeq = 0; fastaSourceSeq = 0; gffSourceSeq = 0;
  document.getElementById('fastaBox').classList.remove('loaded');
  document.getElementById('gffBox').classList.remove('loaded');
  document.getElementById('searchBox').value = '';
  rebuild();
}

// ── Build output files ──
function buildFasta(o, nameMap) {
  const mem = orderedMembers(o, nameMap);
  const lines = [];
  for (const r of mem) {
    const nm = nameMap[r.id];
    lines.push(r.desc ? `>${nm} ${r.desc}` : `>${nm}`);
    for (let i = 0; i < r.sequence.length; i += 80) lines.push(r.sequence.slice(i, i + 80));
  }
  return lines.join('\n') + '\n';
}

function buildGff(o, nameMap) {
  const mem = orderedMembers(o, nameMap);
  const lines = ['##gff-version 3'];
  const entriesByRecord = new Map();
  const directives = new Set();
  for (const r of mem) {
    const entries = featureEntriesForRecord(r);
    entriesByRecord.set(r.id, entries);
    for (const { source } of entries) for (const directive of source.directives) directives.add(directive);
  }
  lines.push(...directives);
  for (const r of mem) {
    if ((entriesByRecord.get(r.id) || []).length) lines.push(`##sequence-region ${nameMap[r.id]} 1 ${r.length}`);
  }
  for (const r of mem) {
    const nm = nameMap[r.id];
    for (const { feature } of entriesByRecord.get(r.id) || []) {
      const cols = feature.cols.slice();
      cols[0] = nm; // rewrite seqid to match the FASTA header
      lines.push(cols.join('\t'));
    }
  }
  return lines.join('\n') + '\n';
}

function downloadOutput(oid, kind) {
  const o = outputs.find(x => x.id === oid);
  if (!o) return;
  const nameMap = resolveExportNames();
  const blockers = outputBlockers(o, nameMap);
  if (blockers.length) {
    alert(`Cannot export ${o.name}:\n\n• ${blockers.join('\n• ')}`);
    return;
  }
  const warnings = outputWarnings(o);
  if (warnings.length && !confirm(`Please review warnings for ${o.name}:\n\n• ${warnings.join('\n• ')}\n\nContinue?`)) return;
  if (kind === 'fasta') downloadBlob(buildFasta(o, nameMap), o.name + '.fasta');
  else downloadBlob(buildGff(o, nameMap), o.name + '.gff');
}

function downloadBlob(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  triggerDownload(blob, filename);
}

function downloadAllZip() {
  const nameMap = resolveExportNames();
  const nonEmpty = outputs.filter(o => o.members.size > 0);
  const blocked = nonEmpty.map(o => ({ o, blockers: outputBlockers(o, nameMap) })).filter(x => x.blockers.length);
  if (blocked.length) {
    alert(`Cannot export:\n\n${blocked.map(x => `${x.o.name}: ${x.blockers.join('; ')}`).join('\n')}`);
    return;
  }
  const warnings = [...new Set(nonEmpty.flatMap(outputWarnings))];
  if (warnings.length && !confirm(`Please review these warnings:\n\n• ${warnings.join('\n• ')}\n\nContinue with ZIP export?`)) return;

  const files = [];
  const usedBases = new Set();
  let totalBytes = 0;
  for (const o of nonEmpty) {
    let base = o.name;
    let suffix = 2;
    while (usedBases.has(base)) base = `${o.name}.${suffix++}`;
    usedBases.add(base);
    const fastaData = new TextEncoder().encode(buildFasta(o, nameMap));
    totalBytes += fastaData.length;
    files.push({ name: base + '.fasta', data: fastaData });
    const feats = [...o.members].reduce((a, rid) => { const r = records.find(x=>x.id===rid); return a + (r?featureCount(r):0); }, 0);
    if (feats > 0) {
      const gffData = new TextEncoder().encode(buildGff(o, nameMap));
      totalBytes += gffData.length;
      files.push({ name: base + '.gff', data: gffData });
    }
    if (totalBytes > MAX_ZIP_BYTES) {
      alert(`ZIP export exceeds the ${Math.round(MAX_ZIP_BYTES / 1024 / 1024)} MiB in-memory safety limit. Download outputs individually.`);
      return;
    }
  }
  if (!files.length) { alert('No non-empty outputs to export.'); return; }
  if (files.length > 65535) {
    alert('ZIP export exceeds the classic ZIP limit of 65,535 entries. Reduce the number of outputs.');
    return;
  }
  const blob = makeZip(files);
  triggerDownload(blob, 'combined_genomes.zip');
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Minimal store-only ZIP writer (no dependencies) ──
function crc32(bytes) {
  let table = crc32._t;
  if (!table) {
    table = crc32._t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const chunks = [];
  const central = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const local = new Uint8Array([].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0)
    ));
    chunks.push(local, nameBytes, data);
    const cd = new Uint8Array([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset)
    ));
    central.push(cd, nameBytes);
    offset += local.length + nameBytes.length + data.length;
  }

  const cdStart = offset;
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const end = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(cdStart), u16(0)
  ));

  const all = chunks.concat(central, [end]);
  let total = 0;
  for (const c of all) total += c.length;
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of all) { out.set(c, p); p += c.length; }
  return new Blob([out], { type: 'application/zip' });
}
